# Run from this directory: docker compose up -d --build
# Settings come from .env next to this file (not in git), e.g.
#   BACKCHANNEL_UID=1000
#   BACKCHANNEL_DATA=/var/lib/backchannel
#   BACKCHANNEL_ORIGIN=https://chat.example.net
# (The older names SIGNAL_UID, SIGNAL_DATA and RAMBOX_ORIGIN still work.)

name: backchannel

services:
  backchannel:
    build:
      context: ../..
      dockerfile: contrib/backchannel/Dockerfile
      args:
        SIGNAL_UID: ${BACKCHANNEL_UID:-${SIGNAL_UID:-1000}}
    image: backchannel:latest
    restart: unless-stopped
    environment:
      BACKCHANNEL_ORIGIN: ${BACKCHANNEL_ORIGIN:-${RAMBOX_ORIGIN:-}}
      SIGNAL_EXTRA_ARGS: ${SIGNAL_EXTRA_ARGS:-}
      # One-time history import: put a Signal local-backup snapshot folder at <data dir>/import/snapshot, then use
      # File > Stage local backup for import in the not-yet-linked window (patches/0002). Unused otherwise.
      BACKCHANNEL_LOCAL_BACKUP_DIR: /data/import/snapshot
    ports:
      # Host loopback only: a reverse proxy (or ssh -L) puts the chat page
      # in front of people, and VNC is for the one-time link and approval.
      - '127.0.0.1:8083:8083'
      - '127.0.0.1:5901:5900'
    volumes:
      - ${BACKCHANNEL_DATA:-${SIGNAL_DATA:?set BACKCHANNEL_DATA in .env}}:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
