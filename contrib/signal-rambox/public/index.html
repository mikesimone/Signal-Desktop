<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Signal</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div id="banner" class="banner" hidden>
      <span id="banner-text"></span>
      <button id="banner-action" type="button" hidden></button>
    </div>
    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="search-row">
            <input
              id="search"
              type="search"
              placeholder="Search chats"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              type="button"
              class="icon-button"
              id="search-open"
              title="Search chats"
              aria-label="Search chats"
            ></button>
            <button
              type="button"
              class="icon-button"
              id="filter-unread"
              title="Filter by unread"
              aria-label="Filter by unread"
              aria-pressed="false"
            ></button>
          </div>
          <div class="filters" id="filters" role="toolbar"></div>
        </div>
        <ul id="conversations" class="conversations" role="listbox"></ul>
      </aside>
      <section class="chat" id="chat">
        <div class="empty" id="empty">Pick a chat on the left.</div>
        <header class="chat-head" id="chat-head" hidden>
          <span id="chat-avatar"></span>
          <span class="chat-head-text">
            <span id="chat-title"></span>
            <span id="chat-sub" class="sub"></span>
          </span>
        </header>
        <div class="messages" id="messages" hidden>
          <button id="older" class="older" type="button" hidden>
            Load older messages
          </button>
          <ol id="message-list"></ol>
        </div>
        <div class="send-error" id="send-error" hidden></div>
        <div class="reply-bar" id="reply-bar" hidden>
          <div class="reply-quote" id="reply-quote"></div>
          <button
            type="button"
            class="icon-button"
            id="reply-cancel"
            title="Cancel reply"
            aria-label="Cancel reply"
          ></button>
        </div>
        <div class="draft-tray" id="draft-tray" hidden></div>
        <form class="composer" id="composer" hidden>
          <button
            type="button"
            class="icon-button"
            id="attach"
            title="Add attachment"
            aria-label="Add attachment"
          ></button>
          <input id="attach-input" type="file" multiple hidden />
          <button
            type="button"
            class="icon-button"
            id="emoji-open"
            title="Emoji"
            aria-label="Emoji"
          ></button>
          <textarea
            id="compose"
            rows="1"
            placeholder="Message"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="send">Send</button>
        </form>
      </section>
    </main>
    <div class="popover" id="reaction-picker" role="menu" hidden></div>
    <div class="popover menu" id="more-menu" role="menu" hidden></div>
    <div class="popover emoji-picker" id="emoji-picker" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="modal-backdrop" id="forward" hidden>
      <div class="modal" role="dialog" aria-labelledby="forward-title">
        <div class="modal-head">
          <span id="forward-title">Forward message</span>
          <button
            type="button"
            class="icon-button"
            id="forward-close"
            title="Close"
            aria-label="Close"
          ></button>
        </div>
        <input
          id="forward-search"
          type="search"
          placeholder="Search chats"
          autocomplete="off"
          spellcheck="false"
        />
        <ul class="forward-list" id="forward-list"></ul>
        <div class="modal-foot">
          <span id="forward-count" class="sub"></span>
          <button type="button" id="forward-send" disabled>Forward</button>
        </div>
      </div>
    </div>
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-bar">
        <a
          class="icon-button"
          id="lightbox-save"
          title="Save"
          aria-label="Save"
        ></a>
        <button
          type="button"
          class="icon-button"
          id="lightbox-close"
          title="Close"
          aria-label="Close"
        ></button>
      </div>
      <div class="lightbox-stage" id="lightbox-stage"></div>
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </body>
</html>
