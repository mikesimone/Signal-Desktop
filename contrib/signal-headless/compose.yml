# Run from this directory: docker compose up -d --build
# Settings come from .env next to this file (not in git), e.g.
#   SIGNAL_UID=994
#   SIGNAL_DATA=/var/lib/signal-desktop-headless
#   RAMBOX_ORIGIN=https://sigdesktop.example.net

services:
  signal-desktop:
    build:
      context: ../..
      dockerfile: contrib/signal-headless/Dockerfile
      args:
        SIGNAL_UID: ${SIGNAL_UID:-1000}
    image: signal-headless:latest
    restart: unless-stopped
    environment:
      RAMBOX_ORIGIN: ${RAMBOX_ORIGIN:-}
      SIGNAL_EXTRA_ARGS: ${SIGNAL_EXTRA_ARGS:-}
    ports:
      # Host loopback only: a reverse proxy (or ssh -L) puts the chat page
      # in front of people, and VNC is for the one-time link and approval.
      - '127.0.0.1:8083:8083'
      - '127.0.0.1:5901:5900'
    volumes:
      - ${SIGNAL_DATA:?set SIGNAL_DATA in .env}:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
