# Fork-only: checks that the headless Signal image still builds. Run it by
# hand after rebasing onto a new Signal release.
name: Signal headless image
on:
  push:
    branches:
      - main
    paths:
      - 'contrib/signal-headless/**'
      - '.github/workflows/signal-headless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          rc=0
          docker build --progress=plain -f contrib/signal-headless/Dockerfile \
            -t signal-headless . > build.log 2>&1 || rc=$?
          if [ "$rc" != 0 ]; then
            # Annotations can be read without downloading the full log.
            grep -E 'ERROR|ERR!|[Ee]rror|Trace|signal [0-9]|core dumped' build.log |
              tail -n 8 | while IFS= read -r line; do
                echo "::error::${line:0:900}"
              done
            echo "::error::exit $rc; tail: $(tail -n 6 build.log | tr '\n' ' ' | cut -c1-900)"
          fi
          tail -n 200 build.log
          exit "$rc"
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'

      - name: Check the image
        run: |
          check() {
            local name="$1"; shift
            if "$@" > check.log 2>&1; then
              echo "::notice title=$name::$(tail -n 3 check.log | tr '\n' ' ')"
            else
              rc=$?
              tail -n 15 check.log | while IFS= read -r line; do
                echo "::error title=$name (exit $rc)::$line"
              done
              return $rc
            fi
          }
          check helper docker run --rm --entrypoint node signal-headless \
            /opt/signal-rambox/signal-rambox.mjs --config /tmp/c --url || fail=1
          check desktop docker run --rm --entrypoint /opt/Signal/signal-desktop \
            signal-headless --version || fail=1
          check desktop-seccomp docker run --rm \
            --security-opt seccomp=contrib/signal-headless/seccomp.json \
            --entrypoint /opt/Signal/signal-desktop \
            signal-headless --version || fail=1
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          exit "${fail:-0}"
