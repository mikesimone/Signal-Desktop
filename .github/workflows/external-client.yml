name: External client
on:
  push:
    branches:
      - main
    paths:
      - 'ts/externalClient/**'
      - 'ts/test-node/externalClient/**'
      - 'ts/test-helpers/externalClientFakeClient.node.ts'
      - 'packages/windows-local-pipe/**'
      - '.github/workflows/external-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build workspace types
        run: pnpm run build
        working-directory: packages/types
        shell: bash

      - name: Build protobuf
        run: pnpm run build:protobuf
        shell: bash

      - name: Build native pipe module (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: npx --yes node-gyp@12.4.0 rebuild
        working-directory: packages/windows-local-pipe
        shell: bash

      - name: Run external client tests
        run: >-
          node_modules/.bin/mocha --node-option import=tsx --extension ts
          'ts/test-node/externalClient/*_test.*.ts'
        shell: bash
        env:
          NODE_ENV: test
